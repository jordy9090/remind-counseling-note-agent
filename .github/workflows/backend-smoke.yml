name: Product CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    env:
      USE_STUB: "1"
      ENABLE_RAG: "0"
      ENABLE_PERSISTENCE: "0"
      SAVE_RAW_INPUT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --link-mode=copy

      - name: Run backend smoke test
        working-directory: backend
        run: uv run python smoke_test.py

      - name: Run serverless wrapper regressions
        working-directory: backend
        run: uv run python test_vercel_wrappers.py

  backend-pdf-export:
    runs-on: ubuntu-latest
    env:
      USE_STUB: "1"
      ENABLE_RAG: "0"
      ENABLE_PERSISTENCE: "0"
      SAVE_RAW_INPUT: "0"
      REQUIRE_PDF_EXPORT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libffi8 \
            libgdk-pixbuf-2.0-0 \
            libglib2.0-0 \
            libharfbuzz-subset0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            shared-mime-info \
            fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --link-mode=copy

      - name: Run PDF-required backend smoke test
        working-directory: backend
        run: |
          uv run python smoke_test.py
          uv run python test_supervision_form.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify frontend workflows
        working-directory: frontend
        run: |
          pnpm verify:material-workflow
          pnpm verify:audio-transcript-workflow

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
