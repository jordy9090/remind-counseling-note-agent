<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <style>
      @page {
        size: A4;
        margin: 18mm 18mm 20mm;
        @bottom-center {
          color: #64748b;
          content: counter(page) " / " counter(pages);
          font-size: 9pt;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        color: #0f172a;
        font-family: ${font_family};
        font-size: 10.5pt;
        line-height: 1.65;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      h1 {
        border: 2px solid #111827;
        color: #111827;
        font-size: 19pt;
        line-height: 1.3;
        margin: 0 0 9mm;
        padding: 4mm;
        text-align: center;
      }

      h2 {
        color: #111827;
        font-size: 13pt;
        margin: 9mm 0 3mm;
        break-after: avoid;
      }

      h3 {
        color: #111827;
        font-size: 11pt;
        margin: 6mm 0 2mm;
        break-after: avoid;
      }

      p {
        margin: 0 0 2.2mm;
        white-space: pre-wrap;
      }

      ul,
      ol {
        margin: 0 0 2.2mm 5mm;
        padding: 0;
      }

      li {
        margin-bottom: 1.3mm;
      }

      .metadata {
        border-collapse: collapse;
        margin-bottom: 7mm;
        width: 100%;
      }

      .metadata th,
      .metadata td,
      .content-table th,
      .content-table td {
        border: 1px solid #cbd5e1;
        padding: 2mm 2.5mm;
        text-align: left;
        vertical-align: top;
      }

      .metadata th {
        background: #e5e7eb;
        color: #111827;
        width: 25mm;
      }

      .metadata td { width: 55mm; }

      .content-table {
        border-collapse: collapse;
        margin: 2mm 0 4mm;
        width: 100%;
        break-inside: auto;
      }

      .content-table tr { break-inside: avoid; }

      .content-table th {
        background: #e2e8f0;
        color: #334155;
        font-weight: 700;
      }

      .transcript {
        margin: 2mm 0 4mm;
      }

      .transcript-turn {
        background: #f8fafc;
        border-radius: 3mm;
        display: grid;
        gap: 3mm;
        grid-template-columns: 18mm 1fr;
        margin-bottom: 1.5mm;
        padding: 2mm 2.5mm;
      }

      .transcript-turn strong {
        color: #111827;
      }

      .reflection-box {
        background: #f3f4f6;
        border: 1px solid #374151;
        border-radius: 2.5mm;
        margin: 2mm 0 4mm;
        padding: 3mm;
      }

      .block-label {
        font-weight: 700;
        margin: 2.5mm 0 1.5mm;
        break-after: avoid;
      }

      .document-section { break-inside: auto; }

      .blank-line {
        height: 3mm;
      }

      .review-notice {
        border-top: 1px solid #cbd5e1;
        color: #475569;
        font-size: 9pt;
        margin-top: 11mm;
        padding-top: 3mm;
      }
    </style>
  </head>
  <body>
    <h1>${title}</h1>
    <table class="metadata">
      <tbody>
        ${metadata_rows}
      </tbody>
    </table>
    ${sections}
    <p class="review-notice">${review_notice}</p>
  </body>
</html>
