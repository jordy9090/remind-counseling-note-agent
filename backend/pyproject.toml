[project]
name = "remind-counseling-note-agent"
version = "0.1.0"
description = "Counseling note agent MVP using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.33",
]

[tool.uv]
# uv 패키지 매니저 설정
allow-prerelease = true
