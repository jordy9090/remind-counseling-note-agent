[project]
name = "remind-counseling-note-agent"
version = "0.1.0"
description = "Counseling note agent MVP using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.1",
    "lxml>=6.0.0,<7.0.0a0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "weasyprint>=62.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
audio-whisperx = [
    "whisperx==3.8.6",
    "numpy>=1.26,<3",
]

[tool.uv]
# Allow prerelease packages when resolving this MVP demo environment.
prerelease = "allow"
