[project]
name = "remind-counseling-note-agent"
version = "0.1.0"
description = "Counseling note agent MVP using LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.1",
    "lxml>=6.0.0,<7.0.0a0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "weasyprint>=62.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
audio-local = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.4",
    "funasr==1.3.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.6",
    "numpy>=2.1,<3",
    "soundfile>=0.13,<1",
    "scikit-learn>=1.6,<2",
    "huggingface-hub>=0.34,<1",
]
audio-evaluation = [
    "rapidfuzz>=3.14,<4",
    "psutil>=7,<8",
    "edge-tts==7.2.3",
]
audio-whisperx = [
    "whisperx==3.8.6",
    "numpy>=1.26,<3",
]

[tool.uv]
# Allow prerelease packages when resolving this MVP demo environment.
prerelease = "allow"
